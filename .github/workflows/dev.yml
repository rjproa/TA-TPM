# DEV: cada push a una rama feature/* se revisa, se compila y se publica como "Yunta Dev".
name: dev

on:
  push:
    branches: ['feature/**']

# Si llegan dos push seguidos a la misma rama, solo se compila el último.
concurrency:
  group: dev-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secretos:
    name: Buscar secretos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Ejecutar Gitleaks
        run: .github/scripts/gitleaks.sh

  compilar:
    name: Compilar, probar y publicar
    runs-on: ubuntu-latest
    needs: secretos
    permissions:
      contents: write
    env:
      VERSION_CODE: ${{ github.run_number }}
      BUILD_RAMA: ${{ github.ref_name }}
      BUILD_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - name: Probar y compilar
        run: ./gradlew --console=plain testDebugUnitTest assembleDebug
      - name: Publicar Yunta Dev
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk yunta-dev.apk
          sha256sum yunta-dev.apk > yunta-dev.apk.sha256

          NOTAS="Última compilación de desarrollo. Se sobrescribe con cada push a una rama feature/*.

          - Rama: \`$BUILD_RAMA\`
          - Commit: \`$GITHUB_SHA\`
          - Compilación: $VERSION_CODE
          - SHA-256: \`$(cut -d' ' -f1 yunta-dev.apk.sha256)\`"

          if gh release view dev-latest >/dev/null 2>&1; then
            # La versión ya existe: se mueve la etiqueta al commit nuevo y se reemplaza el instalador.
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/dev-latest" -f sha="$GITHUB_SHA" -F force=true >/dev/null
            gh release upload dev-latest yunta-dev.apk yunta-dev.apk.sha256 --clobber
            gh release edit dev-latest --notes "$NOTAS"
          else
            gh release create dev-latest yunta-dev.apk yunta-dev.apk.sha256 \
              --prerelease --target "$GITHUB_SHA" \
              --title "Yunta Dev (última compilación)" --notes "$NOTAS"
          fi

          echo "Instalador: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/dev-latest/yunta-dev.apk" >> "$GITHUB_STEP_SUMMARY"
